    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong background. Runs inline and synchronously, on purpose.
      (function () {
        try {
          var stored = localStorage.getItem('retailops-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : (prefersDark ? 'dark' : 'light');
        } catch (e) {
          // Private mode or blocked storage: fall back to light.
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
